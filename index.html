<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Packet Journey | 인터넷 통신 시뮬레이터</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#080f20;color:#edf4ff}main{max-width:1000px;margin:auto;padding:24px 16px 60px}.tag{color:#75bfff;font-size:12px;letter-spacing:2px;font-weight:800}h1{font-size:clamp(26px,6vw,39px);margin:8px 0}p{color:#aebfd9;line-height:1.65}.panel{background:#111d35;border:1px solid #304261;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 7px 24px #0002}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:14px;font-weight:650;margin:0 0 7px}textarea{width:100%;background:#0b1528;color:white;border:1px solid #49617f;border-radius:10px;padding:12px;font:inherit;min-height:76px;resize:vertical}input[type=range]{width:100%;accent-color:#5caeff}button{border:0;border-radius:11px;padding:14px 18px;font-weight:800;font-size:15px;touch-action:manipulation;cursor:pointer}button.primary{background:#58a9ff;color:#061426;flex:1}button.secondary{background:#283c59;color:white}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#0b1528;border-radius:12px;padding:12px}.metric strong{display:block;font-size:clamp(21px,3vw,29px);color:#7ec3ff}.metric small{color:#aebfd9}svg{width:100%;height:auto;display:block;overflow:visible}.node{fill:#1f3554;stroke:#7090b7;stroke-width:2}.node.server{stroke:#78e2aa}.path{fill:none;stroke:#3a5578;stroke-width:5;stroke-linecap:round}.node-label{font-size:13px;fill:#e8f3ff;text-anchor:middle;font-weight:600}.hint{font-size:11px;fill:#9bb1cd;text-anchor:middle}.packet{fill:#fbcf6c;stroke:#fff3c2;stroke-width:2;filter:drop-shadow(0 0 7px #fbcf6c)}.log{background:#071223;border-radius:12px;padding:12px;height:180px;overflow:auto;font:12px/1.7 ui-monospace,SFMono-Regular,monospace;color:#c7d8f3}.status{font-weight:750;color:#8de4b8;min-height:23px}.footer{font-size:12px}@media(max-width:640px){.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.node-label{font-size:12px}}
</style>
</head>
<body><main>
<div class="tag">NETWORK LAB · EDUCATIONAL SIMULATION</div><h1>🌐 인터넷 통신 시뮬레이터</h1><p>메시지가 패킷으로 나뉘어 공유기와 라우터를 통과한 뒤 서버에 도착하는 과정을 체험해 보세요. 모든 통신은 화면 안에서만 재현됩니다.</p>
<section class="panel"><div class="controls"><div class="full"><label for="msg">보낼 메시지</label><textarea id="msg" maxlength="200" placeholder="예: 안녕하세요! 인터넷은 어떻게 작동할까요?">안녕하세요! 패킷이 서버로 이동합니다.</textarea></div><div><label for="speed">전송 속도: <span id="speedLabel">보통</span></label><input id="speed" type="range" min="1" max="5" value="3"></div><div><label for="loss">패킷 손실 확률: <span id="lossLabel">10%</span></label><input id="loss" type="range" min="0" max="60" step="5" value="10"></div><div class="full actions"><button class="primary" type="button" id="start">▶ 전송 시작</button><button class="secondary" type="button" id="reset">↻ 초기화</button></div></div></section>
<section class="panel"><div class="status" id="status" role="status" aria-live="polite">전송 준비 완료</div><svg id="map" viewBox="0 0 680 270" role="img" aria-label="내 기기에서 공유기, 두 경로의 라우터를 지나 서버에 도착하는 네트워크 구조"><path class="path" d="M75 135 L200 135 L335 70 L470 135 L605 135 M200 135 L335 205 L470 135"/><circle class="node" cx="75" cy="135" r="31"/><circle class="node" cx="200" cy="135" r="31"/><circle class="node" cx="335" cy="70" r="31"/><circle class="node" cx="335" cy="205" r="31"/><circle class="node" cx="470" cy="135" r="31"/><circle class="node server" cx="605" cy="135" r="31"/><g class="node-label"><text x="75" y="140">기기</text><text x="200" y="140">공유기</text><text x="335" y="75">라우터 A</text><text x="335" y="210">라우터 B</text><text x="470" y="140">인터넷</text><text x="605" y="140">서버</text></g><g class="hint"><text x="75" y="187">클라이언트</text><text x="605" y="187">목적지</text></g><circle class="packet" id="packet" cx="75" cy="135" r="9" visibility="hidden"/></svg><div class="metrics"><div class="metric"><strong id="total">0</strong><small>전체 패킷</small></div><div class="metric"><strong id="received">0</strong><small>도착 패킷</small></div><div class="metric"><strong id="lost">0</strong><small>손실·재전송 횟수</small></div><div class="metric"><strong id="elapsed">0.0s</strong><small>경과 시간</small></div></div></section>
<section class="panel"><label>📋 이벤트 로그</label><div class="log" id="log" aria-live="polite">전송 버튼을 누르면 패킷 이동 과정이 표시됩니다.</div><p class="footer">※ 실제 인터넷에 메시지를 보내지 않습니다. 손실·라우팅·재전송은 네트워크 원리를 설명하기 위해 단순화한 모델입니다.</p></section>
</main><script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)}, speed=$('speed'),loss=$('loss'),btn=$('start'),packet=$('packet'),running=false,token=0,tick=0,stats={total:0,received:0,lost:0};
function render(){ $('total').textContent=stats.total;$('received').textContent=stats.received;$('lost').textContent=stats.lost; }
function log(message){var el=$('log');if(el.textContent.indexOf('전송 버튼을 누르면')===0)el.textContent='';var line=document.createElement('div');line.textContent='['+new Date().toLocaleTimeString('ko-KR')+'] '+message;el.appendChild(line);el.scrollTop=el.scrollHeight;}
function wait(ms,run){return new Promise(function(resolve){setTimeout(function(){resolve(run===token);},ms);});}
function setPos(x,y){packet.setAttribute('cx',x);packet.setAttribute('cy',y);}
async function move(a,b,ms,run){packet.setAttribute('visibility','visible');var start=performance.now();return new Promise(function(resolve){function frame(now){if(run!==token){resolve(false);return;}var t=Math.min((now-start)/ms,1);setPos(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t);if(t<1)requestAnimationFrame(frame);else resolve(true);}requestAnimationFrame(frame);});}
function labels(){var names=['매우 느림','느림','보통','빠름','매우 빠름'];$('speedLabel').textContent=names[Number(speed.value)-1];$('lossLabel').textContent=loss.value+'%';}
function reset(){token++;running=false;clearInterval(tick);btn.disabled=false;stats={total:0,received:0,lost:0};render();$('elapsed').textContent='0.0s';$('status').textContent='전송 준비 완료';$('log').textContent='전송 버튼을 누르면 패킷 이동 과정이 표시됩니다.';packet.setAttribute('visibility','hidden');}
async function start(){if(running)return;var message=$('msg').value.trim();if(!message){$('status').textContent='메시지를 입력해 주세요.';return;}reset();running=true;btn.disabled=true;var run=token,started=performance.now(),duration=650/Number(speed.value);tick=setInterval(function(){if(run===token)$('elapsed').textContent=((performance.now()-started)/1000).toFixed(1)+'s';},100);var chars=Array.from(message),chunks=[];for(var i=0;i<chars.length;i+=10)chunks.push(chars.slice(i,i+10).join(''));stats.total=chunks.length;render();log('메시지를 '+chunks.length+'개 패킷으로 분할');$('status').textContent='패킷 전송 중…';var a=[75,135],b=[200,135],c=[470,135],d=[605,135];for(var k=0;k<chunks.length;k++){var retry=0,delivered=false;while(!delivered&&retry<8){if(run!==token)return;var router=(k%2===0)?[335,70]:[335,205];log('패킷 '+(k+1)+' : 전송'+(retry?' (재전송 '+retry+'회)':'')+' / '+(k%2===0?'A':'B')+' 경로');for(var pair of [[a,b],[b,router],[router,c],[c,d]]){if(!await move(pair[0],pair[1],duration,run))return;}if(Math.random()*100<Number(loss.value)){stats.lost++;retry++;log('⚠ 패킷 '+(k+1)+' 손실 → 재전송');render();if(!await wait(250,run))return;}else{stats.received++;delivered=true;render();log('✓ 패킷 '+(k+1)+' 도착: '+chunks[k]);}packet.setAttribute('visibility','hidden');}if(!delivered)log('✕ 패킷 '+(k+1)+' 최대 재시도 초과');}clearInterval(tick);$('elapsed').textContent=((performance.now()-started)/1000).toFixed(1)+'s';$('status').textContent=stats.received===stats.total?'✅ 모든 패킷이 서버에 도착했습니다.':'⚠ 전송 종료: 일부 패킷 전달 실패';log('완료: '+stats.received+'/'+stats.total+'개 도착');running=false;btn.disabled=false;}
$('start').addEventListener('click',function(){start().catch(function(err){console.error(err);$('status').textContent='오류가 발생했습니다. 초기화 후 다시 시도해 주세요.';btn.disabled=false;running=false;clearInterval(tick);});});$('reset').addEventListener('click',reset);speed.addEventListener('input',labels);loss.addEventListener('input',labels);labels();render();
})();
</script></body></html>
